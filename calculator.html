          <svg
            xmlns="http://www.w3.org/2000/svg"

    <script>
      let a = 0;
      let x = 0;
      let y = 0;
      let operator = "";
      let decimal = 0;


      const content = document.getElementById("content0");

      const calculate = () => {
  if (operator === "+") {
    y = Number((y + x).toFixed(10));
  } else if (operator === "-") {
    y = Number((y - x).toFixed(10));
  } else if (operator === "*") {
    y = Number((y * x).toFixed(10));
  } else if (operator === "/") {
    y = Number((y / x).toFixed(10));
  }
};

      const one = () => {
         if (decimal === 0) {
    if (a === 0) x = 0;
    x = x * 10 + 1;
  } else {
    x = x + 1 / (decimal * 10);
    decimal = decimal * 10;
  }
  a = 1;
  content.textContent = x;
      };


      const two = () => {
        if (decimal === 0) {
    if (a === 0) x = 0;
    x = x * 10 + 2;
  } else {

      const eight = () => {
        if (decimal === 0) {

  } else {

      const nine = () => {
        if (decimal === 0) {

      const zero = () => {
        if (decimal === 0) {
    if (a === 0) x = 0;

  } else {
    x = x + 0 / (decimal * 10);
    decimal = decimal * 10;
  }
  a = 1;
  content.textContent = x;
      };


      const del = () => {
        if (x===0){
          y=0;
          a=0;
          operator = "";
        } else {x=0;}
        decimal=0;
        content.textContent = x;
      };

      
      const back = () => {
        if (decimal > 1) {
          x = x * decimal ;
          x = (x - (x % 10)) / 10;
          decimal = decimal / 10;
          x = x/decimal ;
          if (decimal === 1) {
    decimal = 0;}
  } else if (decimal === 1) {
    decimal = 0;}
    else  {
    x = (x - (x % 10)) / 10;
  }
  content.textContent = x;
      };



      const plus = () => {
        if (operator === "/" && x === 0 && a === 1) {
  content.textContent = "Error";
  x = 0;
  y = 0;
  a = 0;
  operator = "";
  decimal = 0;
  return;
}
  if (a === 1) {
    if (operator === "") {
      y = x;
    } else {
      calculate();
    }
    content.textContent = y;
    x = 0;
    a = 0;
  } else if (operator === "") {
    y = x;
  }
  decimal=0;
  operator = "+";
};

const minus = () => {
  if (operator === "/" && x === 0 && a === 1) {
  content.textContent = "Error";
  x = 0;
  y = 0;

  operator = "";
  decimal = 0;
  return;
}
  if (a === 1) {
    if (operator === "") {

    }

  } else if (operator === "") {
    y = x;
  }
  decimal=0;

};

const multiple = () => {
  if (operator === "/" && x === 0 && a === 1) {
  content.textContent = "Error";

  a = 0;
  operator = "";
  decimal = 0;
  return;
}
  if (a === 1) {
    if (operator === "") {

    }
    content.textContent = y;

  } else if (operator === "") {
    y = x;
  }
  decimal=0;

};

const divide = () => {
  if (operator === "/" && x === 0 && a === 1) {
  content.textContent = "Error";
  x = 0;
  y = 0;
  a = 0;
  operator = "";
  decimal = 0;
  return;
}
  if (a === 1) {
    if (operator === "") {
      y = x;
    } else {
      calculate();
    }
    content.textContent = y;
    x = 0;
    a = 0;
  } else if (operator === "") {
    y = x;
  }
  decimal=0;
  operator = "/";
};

const end = () => {
  if (operator === "/" && x === 0 && a === 1) {
  content.textContent = "Error";
  x = 0;
  y = 0;
  a = 0;
  operator = "";
  decimal = 0;
  return;
}
  if (operator !== "" && a === 1) {
    calculate();
    x = y;
    content.textContent = x;
    y = 0;
    operator = "";
    a = 0;
  }
  decimal=0;
};

const persent = () => {
  if (a === 1) {
    if (operator === "+" || operator === "-") {
      x = y * x / 100;
    } else {
      x = x / 100;
    }

    x = Number(x.toFixed(10));
    decimal = 0;
    content.textContent = x;
  }
};

const dot = () => {
  if (decimal === 0) {
    if (a === 0) {
      x = 0;
      a = 1;
      content.textContent = "0.";
    } else {
      content.textContent = x + ".";
    }

    decimal = 1;
  }

};

const swapSign = () => {
    x = x * -1;
    content.textContent = x;
  };
